name: Publish

on:
  push:
    branches: [main]

# The workflow itself can read. Every write is granted on the job below.
permissions:
  contents: read

# Never cancel a publish, and never let two of them interleave: the "a tag means
# this version is in the registry" invariant depends on publish-then-tag running
# to completion.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    # Declared here, at the point they are used: `packages` to publish,
    # `contents` to push the tag.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The current Node LTS, pinned rather than tracked via `lts/*`, so a
          # new LTS never changes what this workflow runs without a commit.
          node-version: '24'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@antho686'

      - name: Install dependencies from the lockfile
        run: npm ci

      # The merge result can differ from any pull request head that the gate in
      # pull-request.yml already verified, so it is rebuilt and retested here.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the build produced the promised entry points
        run: node .github/scripts/verify-entry-points.mjs

      - name: Log the files that would be published
        run: npm pack --dry-run

      - name: Determine whether this version is already published
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/resolve-publish-decision.sh

      # GitHub Packages masks a package the token may not read as a 404, so the
      # lookup above cannot tell "absent" from "unreadable" on its own. The
      # registry settles it: publishing an existing version is refused with a
      # conflict, which is the authoritative "already published". Any other
      # failure is a real failure and fails the run.
      - name: Publish to GitHub Packages
        id: publish
        if: steps.registry.outputs.should-publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          publish_log="$(mktemp)"

          set +e
          npm publish 2>&1 | tee "$publish_log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'EPUBLISHCONFLICT|cannot publish over|409 Conflict' "$publish_log"; then
            echo "already published, skipping: the registry refused this version as already present."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "The publish failed for a reason other than the version already existing."
            exit 1
          fi

      # Only after a successful publish, so a tag always means "this version
      # exists in the registry".
      - name: Tag the published commit
        if: steps.publish.outputs.published == 'true'
        env:
          VERSION: ${{ steps.registry.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
