name: Publish

on:
  push:
    branches: [main]

# The workflow itself can read. Every write is granted on the job below.
permissions:
  contents: read

# Never cancel a publish, and never let two of them interleave: the "a tag means
# this version is in the registry" invariant depends on publish-then-tag running
# to completion.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    # Declared here, at the point they are used: `packages` to publish,
    # `contents` to push the tag.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The current Node LTS, pinned rather than tracked via `lts/*`, so a
          # new LTS never changes what this workflow runs without a commit.
          node-version: '24'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@antho686'

      - name: Install dependencies from the lockfile
        run: npm ci

      # The merge result can differ from any pull request head that the gate in
      # pull-request.yml already verified, so it is rebuilt and retested here.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the build produced the promised entry points
        run: node .github/scripts/verify-entry-points.mjs

      - name: Log the files that would be published
        run: npm pack --dry-run

      # GitHub Packages masks a package you cannot read as a 404, so an
      # unusable token would otherwise look exactly like "never published".
      # Proving the token works first means a later 404 really is absence.
      - name: Prove the registry credentials work
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm whoami --registry=https://npm.pkg.github.com

      - name: Determine whether this version is already published
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          error_log="$(mktemp)"
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Looking up $name@$version in GitHub Packages."

          set +e
          published=$(npm view "$name@$version" version --json 2>"$error_log")
          status=$?
          set -e

          if [ "$status" -eq 0 ] && [ -n "$published" ] && [ "$published" != "null" ]; then
            # The registry answered, and the version is there.
            echo "already published, skipping: $name@$version is already in the registry."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ] || grep -qE 'E404|404 Not Found' "$error_log"; then
            # The registry answered, and the version is absent: either an empty
            # result for a package that exists, or a 404 for one that does not.
            echo "$name@$version is not in the registry; it will be published."
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            # Anything else is not an answer about the version, and must never be
            # mistaken for a routine skip.
            echo "The registry lookup for $name@$version failed for a reason other than the version being absent:"
            cat "$error_log"
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: steps.registry.outputs.should-publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      # Only after a successful publish, so a tag always means "this version
      # exists in the registry".
      - name: Tag the published commit
        if: steps.registry.outputs.should-publish == 'true'
        env:
          VERSION: ${{ steps.registry.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
