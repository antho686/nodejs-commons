name: Pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify · Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every runtime, so a failure shows as universal or version-specific.
      fail-fast: false
      matrix:
        # Keep in step with `engines.node` in package.json: the advertised
        # range and the tested range are deliberately identical.
        node-version: ['20', '22', '24']
    steps:
      - name: Check out the merge of the branch into its base
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
